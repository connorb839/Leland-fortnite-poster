<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Christmas Site</title>

<style>
/* --- GLOBAL STYLES --- */
body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(to bottom, #00111f, #002244, #003366);
    color: #fff;
    overflow-x: hidden;
    position: relative;
}

h1, h2 {
    text-align: center;
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    margin-bottom: 20px;
}

.section {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* --- POPUP --- */
#popup {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    text-align: center;
    padding: 20px;
}
#popup h2 {
    font-size: 2rem;
    margin-bottom: 10px;
    color: #ffcc00;
    text-shadow: 0 0 10px #ff0000;
}
#popup button {
    margin-top: 20px;
    padding: 15px 30px;
    font-size: 1.4rem;
    background: #ff0000;
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0 15px #ff0000;
}

/* --- SNOW --- */
.snowflake {
    position: fixed;
    top: -10px;
    color: white;
    font-size: 1.2rem;
    user-select: none;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 20;
}
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

/* --- SANTA --- */
#santaFly {
    position: fixed;
    top: 20px;
    left: -400px;
    width: 600px;
    max-width: 90vw;
    height: auto;
    animation: fly 12s ease-in-out infinite;
    z-index: 200;
}
@keyframes fly { 0% { left: -600px; } 50% { left: 50vw; } 100% { left: 120vw; } }

/* --- CHRISTMAS TREE --- */
#tree {
    width: 350px;
    max-width: 80vw;
    height: auto;
    display: block;
    margin: 40px auto;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
}

/* --- CONTENT BLOCK --- */
.content-block img,
.content-block video {
    width: 100%;
    border-radius: 12px;
    margin-top: 15px;
    box-shadow: 0 0 12px rgba(255,255,255,0.2);
}
p {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 10px;
    backdrop-filter: blur(4px);
    margin-bottom: 40px;
    line-height: 1.6;
}

/* --- LIGHTS --- */
.lights {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 20px 0;
}
.light {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    animation: pulse 1.4s infinite alternate;
}
@keyframes pulse {
    0% { background: red; box-shadow: 0 0 6px red; }
    50% { background: gold; box-shadow: 0 0 6px gold; }
    100% { background: lime; box-shadow: 0 0 6px lime; }
}

/* --- CSS FIREPLACE --- */
#fireplace {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 120px;
    background: #300;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    z-index: 100;
}
.flame {
    width: 20px;
    height: 50px;
    margin: 0 5px;
    background: orange;
    border-radius: 50% 50% 0 0;
    filter: blur(2px);
    animation: flicker 0.3s infinite alternate;
}
@keyframes flicker { from { transform: scaleY(1); } to { transform: scaleY(1.4); } }

/* --- RESPONSIVE --- */
@media(max-width:768px){
    #santaFly { width: 300px; }
    #tree { width: 70vw; }
}
</style>
</head>
<body>

<!-- POPUP -->
<div id="popup">
    <h2>⚠ WARNING ⚠</h2>
    <p>Do not access this Christmas content before December 25th!</p>
    <button onclick="closePopup()">Continue</button>
</div>

<!-- SANTA -->
<img id="santaFly" src="assets/santa.png" alt="Santa">

<!-- MAIN CONTENT -->
<div class="section">
    <h1>🎄 Premium Christmas Experience 🎅</h1>

    <!-- CHRISTMAS TREE -->
    <img id="tree" src="assets/tree.png" alt="Christmas Tree">

    <!-- LIGHTS -->
    <div class="lights">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
    </div>

    <!-- CONTENT BLOCK -->
    <div class="content-block">
        <h2>Image 1 Section</h2>
        <img src="assets/image1.jpg" alt="Image 1">
        <p>Paragraph about Image 1.</p>

        <h2>Image 2 Section</h2>
        <img src="assets/image2.jpg" alt="Image 2">
        <p>Paragraph about Image 2.</p>

        <h2>Video Section</h2>
        <video controls>
            <source src="assets/video.mp4" type="video/mp4">
        </video>
        <p>Paragraph about the video.</p>
    </div>
</div>

<!-- CSS FIREPLACE -->
<div id="fireplace">
    <div class="flame"></div>
    <div class="flame"></div>
    <div class="flame"></div>
    <div class="flame"></div>
</div>

<script>
/* POPUP */
function closePopup(){ document.getElementById("popup").style.display="none"; }

/* SNOW */
for(let i=0;i<80;i++){
    let f=document.createElement("div");
    f.className="snowflake";
    f.innerHTML="❄";
    f.style.left=Math.random()*100+"vw";
    f.style.fontSize=(10+Math.random()*20)+"px";
    f.style.animationDuration=(4+Math.random()*6)+"s";
    document.body.appendChild(f);
}
</script>

</body>
</html>
